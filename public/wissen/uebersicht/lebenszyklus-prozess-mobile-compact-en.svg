<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1248" viewBox="0 0 720 1248" role="img" aria-labelledby="title desc" xml:lang="en">
  <title id="title">Five sub-processes across the product life cycle</title>
  <desc id="desc">Six unnumbered life-cycle phases show the chronological sequence. Below them, the five cross-phase reliability-engineering sub-processes are numbered.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4z" fill="#2ea1cf"/>
    </marker>
    <style>
      .label{font:700 22px Arial,sans-serif;letter-spacing:2px;fill:#2ea1cf}
      .heading{font:700 24px Arial,sans-serif;fill:#142452}
      .copy{font:400 20px Arial,sans-serif;fill:#435075}
      .stage{font:700 20px Arial,sans-serif;fill:#142452}
      .number{font:700 18px Arial,sans-serif;fill:#2ea1cf}
    </style>
  </defs>
  <rect width="720" height="1248" fill="#fff"/>

  <text class="label" x="48" y="50">PRODUCT LIFE CYCLE</text>
  <path d="M340 43h332" stroke="#d5ecf7" stroke-width="2"/>
  <rect x="24" y="76" width="672" height="330" rx="6" fill="#eaf5fb" stroke="#d5ecf7"/>

  <g>
    <rect x="48" y="116" width="288" height="64" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="76" cy="148" r="6" fill="#142452"/>
    <text class="stage" x="98" y="155">Concept</text>

    <rect x="384" y="116" width="288" height="64" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="412" cy="148" r="6" fill="#142452"/>
    <text class="stage" x="434" y="155">Design</text>

    <rect x="384" y="208" width="288" height="64" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="412" cy="240" r="6" fill="#142452"/>
    <text class="stage" x="434" y="247">Detailing</text>

    <rect x="48" y="208" width="288" height="64" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="76" cy="240" r="6" fill="#142452"/>
    <text class="stage" x="98" y="247">Production</text>

    <rect x="48" y="300" width="288" height="64" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="76" cy="332" r="6" fill="#142452"/>
    <text class="stage" x="98" y="339">Customer use</text>

    <rect x="384" y="300" width="288" height="64" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="412" cy="332" r="7" fill="#2ea1cf"/>
    <text class="stage" x="434" y="339">Reuse</text>
  </g>

  <g fill="none" stroke="#2ea1cf" stroke-width="2.5">
    <path d="M336 148h48" marker-end="url(#arrow)"/>
    <path d="M654 180v28" marker-end="url(#arrow)"/>
    <path d="M384 240h-48" marker-end="url(#arrow)"/>
    <path d="M66 272v28" marker-end="url(#arrow)"/>
    <path d="M336 332h48" marker-end="url(#arrow)"/>
    <path d="M672 332h8v54H40V148h8" marker-end="url(#arrow)"/>
  </g>
  <rect x="142" y="370" width="436" height="30" fill="#eaf5fb"/>
  <text class="copy" x="360" y="394" text-anchor="middle" style="font-size:17px">Field experience feeds back into targets and planning</text>

  <text class="label" x="48" y="454">FIVE SUB-PROCESSES</text>
  <path d="M350 447h322" stroke="#d5ecf7" stroke-width="2"/>

  <g>
    <rect x="48" y="480" width="624" height="128" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 480h8v128h-8z" fill="#2ea1cf"/>
    <text class="number" x="84" y="522">01</text>
    <text class="heading" x="132" y="522">Reliability planning</text>
    <text class="copy" x="84" y="566">Targets, responsibilities and verification plan</text>

    <rect x="48" y="620" width="624" height="128" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 620h8v128h-8z" fill="#2ea1cf"/>
    <text class="number" x="84" y="662">02</text>
    <text class="heading" x="132" y="662">Weak-point analysis</text>
    <text class="copy" x="84" y="706">Risks, failure causes and improvements</text>

    <rect x="48" y="760" width="624" height="128" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 760h8v128h-8z" fill="#2ea1cf"/>
    <text class="number" x="84" y="802">03</text>
    <text class="heading" x="132" y="802">Reliability testing</text>
    <text class="copy" x="84" y="846">Tests, loads and lifetime</text>

    <rect x="48" y="900" width="624" height="128" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 900h8v128h-8z" fill="#2ea1cf"/>
    <text class="number" x="84" y="942">04</text>
    <text class="heading" x="132" y="942">Reliability assurance</text>
    <text class="copy" x="84" y="986">Evidence, assessment and release</text>

    <rect x="48" y="1040" width="624" height="128" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 1040h8v128h-8z" fill="#2ea1cf"/>
    <text class="number" x="84" y="1082">05</text>
    <text class="heading" x="132" y="1082">Reliability prediction</text>
    <text class="copy" x="84" y="1126">Field data, lifetime models and forecast</text>
  </g>
</svg>
