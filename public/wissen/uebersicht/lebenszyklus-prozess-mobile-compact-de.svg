<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1248" viewBox="0 0 720 1248" role="img" aria-labelledby="title desc" xml:lang="de">
  <title id="title">Zuverlässigkeitsmanagement im Produktlebenszyklus</title>
  <desc id="desc">Qualitative Methoden, sechs kompakt angeordnete Produktphasen und quantitative Nachweise in einer mobilen Prozessdarstellung.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1l8 4-8 4z" fill="#2ea1cf"/>
    </marker>
    <style>
      .label{font:700 22px Arial,sans-serif;letter-spacing:2px;fill:#2ea1cf}
      .heading{font:700 25px Arial,sans-serif;fill:#142452}
      .copy{font:400 20px Arial,sans-serif;fill:#435075}
      .stage{font:700 23px Arial,sans-serif;fill:#142452}
      .number{font:700 16px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect width="720" height="1248" fill="#fff"/>

  <text class="label" x="48" y="50">QUALITATIV</text>
  <path d="M208 43h464" stroke="#d5ecf7" stroke-width="2"/>
  <g>
    <rect x="48" y="72" width="624" height="92" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 72h8v92h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="110">Anforderungen verstehen</text>
    <text class="copy" x="84" y="142">Lastenheft · Erfahrungswissen</text>

    <rect x="48" y="178" width="624" height="92" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 178h8v92h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="216">Risiken bewerten</text>
    <text class="copy" x="84" y="248">Design Reviews · FTA · Audits</text>

    <rect x="48" y="284" width="624" height="92" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 284h8v92h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="322">Verbesserungen ableiten</text>
    <text class="copy" x="84" y="354">Felddaten · Frühwarnindikatoren</text>
  </g>

  <rect x="24" y="404" width="672" height="430" rx="6" fill="#eaf5fb" stroke="#d5ecf7"/>
  <text class="label" x="48" y="444">PRODUKTLEBENSZYKLUS</text>

  <g>
    <rect x="48" y="474" width="288" height="86" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="82" cy="517" r="22" fill="#142452"/>
    <text class="number" x="82" y="523" text-anchor="middle">01</text>
    <text class="stage" x="118" y="525">Konzeption</text>

    <rect x="384" y="474" width="288" height="86" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="418" cy="517" r="22" fill="#142452"/>
    <text class="number" x="418" y="523" text-anchor="middle">02</text>
    <text class="stage" x="454" y="525">Entwurf</text>

    <rect x="384" y="580" width="288" height="86" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="418" cy="623" r="22" fill="#142452"/>
    <text class="number" x="418" y="629" text-anchor="middle">03</text>
    <text class="stage" x="454" y="631">Ausarbeitung</text>

    <rect x="48" y="580" width="288" height="86" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="82" cy="623" r="22" fill="#142452"/>
    <text class="number" x="82" y="629" text-anchor="middle">04</text>
    <text class="stage" x="118" y="631">Fertigung</text>

    <rect x="48" y="686" width="288" height="86" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="82" cy="729" r="22" fill="#142452"/>
    <text class="number" x="82" y="735" text-anchor="middle">05</text>
    <text class="stage" x="118" y="737">Kundeneinsatz</text>

    <rect x="384" y="686" width="288" height="86" fill="#fff" stroke="#d5ecf7"/>
    <circle cx="418" cy="729" r="22" fill="#2ea1cf"/>
    <text class="number" x="418" y="735" text-anchor="middle">06</text>
    <text class="stage" x="454" y="737" style="font-size:21px">Wiederverwendung</text>
  </g>

  <g fill="none" stroke="#2ea1cf" stroke-width="2.5">
    <path d="M336 517h48" marker-end="url(#arrow)"/>
    <path d="M654 560v20" marker-end="url(#arrow)"/>
    <path d="M384 623h-48" marker-end="url(#arrow)"/>
    <path d="M66 666v20" marker-end="url(#arrow)"/>
    <path d="M336 729h48" marker-end="url(#arrow)"/>
    <path d="M672 729h8v88H40V517h8" marker-end="url(#arrow)"/>
  </g>
  <text class="copy" x="360" y="801" text-anchor="middle">Felderfahrung zurück in Ziele und Planung</text>

  <text class="label" x="48" y="878">QUANTITATIV</text>
  <path d="M222 871h450" stroke="#d5ecf7" stroke-width="2"/>
  <g>
    <rect x="48" y="900" width="624" height="92" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 900h8v92h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="938">Ziele &amp; Risiko</text>
    <text class="copy" x="84" y="970">Zuverlässigkeitsziele · Risikoanalyse</text>

    <rect x="48" y="1006" width="624" height="92" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 1006h8v92h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="1044">Tests &amp; Prozess</text>
    <text class="copy" x="84" y="1076">Testplanung · Prozesskontrolle</text>

    <rect x="48" y="1112" width="624" height="92" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 1112h8v92h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="1150">Feld &amp; Prognose</text>
    <text class="copy" x="84" y="1182">Felddaten · Restlebensdauer</text>
  </g>
</svg>
