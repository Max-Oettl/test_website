    <text class="copy" x="84" y="1339">Testplanung · Prozesskontrolle</text>
    <rect x="48" y="1384" width="624" height="104" fill="#f7fbfd" stroke="#dbe5ec"/>
    <path d="M48 1384h8v104h-8z" fill="#2ea1cf"/>
    <text class="heading" x="84" y="1426">Feld &amp; Prognose</text>
    <text class="copy" x="84" y="1461">Felddaten · Restlebensdauer</text>
  </g>
